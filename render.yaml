services:
  - type: web
    name: pitch-fork-mcp-server
    runtime: node
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: node dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      # Set SUPPORTBRIDGE_API_KEY privately in Render; never commit its value.
      - key: SUPPORTBRIDGE_SOURCE
        value: beta
      - key: SUPPORTBRIDGE_URL
        value: https://supportbridge-staging.onrender.com
      - key: SUPPORTBRIDGE_API_KEY
        sync: false
