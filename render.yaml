services:
  - type: web
    name: pitch-fork-mcp-server
    runtime: node
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: node dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: AUTH0_ISSUER_BASE_URL
        value: https://dev-6zanky8n50kbs3ri.us.auth0.com/
      - key: MCP_RESOURCE_URL
        value: https://pitch-fork-beta.onrender.com/mcp
