services:
  - type: web
    name: pitch-fork-mcp-server
    runtime: node
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: node dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: SUPPORTBRIDGE_URL
        value: https://app.getwith.in
      - key: SUPPORTBRIDGE_SOURCE
        value: beta-pitch-fork-mcp
      - key: SUPPORTBRIDGE_API_KEY
        sync: false
